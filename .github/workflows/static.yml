# Despliega la galería a GitHub Pages.
# Este es el único workflow de deploy: no agregar otro que use el mismo
# concurrency group "pages" o los dos van a competir en cada push.
name: Deploy static content to Pages

on:
  # Solo main. Sin trigger de pull_request: un PR no debe publicar en producción.
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Se publica una lista explícita de archivos, no el repo entero.
      # Así CLAUDE.md, .claude/, DEPLOY.md o cualquier nota suelta en el root
      # no terminan expuestos en el sitio público.
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
